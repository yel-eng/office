<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velvet Coffee</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HERO -->
<header class="hero">
    <img src="images/hero.jfif" class="hero-img">
    <div class="overlay">
        <h1>Velvet Coffee</h1>
        <p>Luxury Coffee Experience</p>

        <a href="#about" class="btn">Explore</a>
    </div>
</header>

<!-- ABOUT -->
<section id="about" class="about">
    <img src="images/about.jpg">

    <div class="text">
        <h2>About Us</h2>
        <p>
            We serve premium handcrafted coffee made from the finest roasted beans,
            delivering a rich and luxurious experience.
        </p>
    </div>
</section>

<!-- SERVICES -->
<section class="services">

    <h2>Our Services</h2>

    <div class="grid">

        <div class="card">
            <img src="images/service1.jpg">
            <h3>Fresh Coffee</h3>
        </div>

        <div class="card">
            <img src="images/service2.jfif">
            <h3>Barista Style</h3>
        </div>

        <div class="card">
            <img src="images/service3.jpg">
            <h3>Premium Beans</h3>
        </div>

    </div>
</section>

<!-- CTA -->
<section class="cta">
    <h2>Experience Real Coffee Luxury</h2>
    <a href="#" class="btn">Order Now</a>
</section>

<script src="script.js"></script>
</body>
</html>
